name: i18n-smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  static-smoke:
    name: Static Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check full-app-loader.js
          node --check locales.js
          node --check i18n-v2.js
          node --check language-switch.js
          node --check info-i18n.js
          node --check experience.js
          node --check functions/_middleware.js
      - name: Locale catalog has all 16 foreign languages
        run: |
          set -eu
          for lang in en ja es zh fr de pt id hi pl it nl tr vi th ar; do
            grep -q "^${lang}:{" locales.js
          done
          grep -q 'window.RandomPickerLocales=P' locales.js
      - name: Language route fallbacks exist
        run: |
          set -eu
          for lang in en ja es zh fr de pt id hi pl it nl tr vi th ar; do
            test -f "$lang/index.html"
            grep -q "rel=\"canonical\"" "$lang/index.html"
            grep -q "/full-app-loader.js" "$lang/index.html"
          done
      - name: Foreign routes use direct edge-rendered full app
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const middleware=fs.readFileSync('functions/_middleware.js','utf8');
          for(const s of ['context.env.ASSETS.fetch','new URL(\'/\',url.origin)','/locales.js','/i18n-v2.js','/language-switch.js','/experience.js']) {
            if(!middleware.includes(s)) throw new Error(`direct-render middleware missing ${s}`);
          }
          if(middleware.includes('full-app-loader.js')) throw new Error('production middleware must not use full-app-loader.js');
          NODE
      - name: One active localization runtime path
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const loader=fs.readFileSync('full-app-loader.js','utf8');
          const middleware=fs.readFileSync('functions/_middleware.js','utf8');
          const required=['/locales.js','/i18n-v2.js','/language-switch.js','/experience.js'];
          const forbidden=['/global-i18n.js','/global-i18n-dynamic.js','/full-i18n-safe.js','/i18n-cleanup.js','/ko-language.js'];
          for(const s of required) if(!loader.includes(s)) throw new Error(`fallback loader missing ${s}`);
          for(const s of required) if(!middleware.includes(s)) throw new Error(`middleware missing ${s}`);
          for(const s of forbidden) if(loader.includes(s)||middleware.includes(s)) throw new Error(`legacy runtime still referenced: ${s}`);
          NODE
      - name: One active info localization runtime
        run: |
          set -eu
          test -f info-i18n.js
          grep -q '/info-i18n.js' functions/_middleware.js
          test ! -e info-locales.js
          test ! -e info-page.js
      - name: Core feature localization keys exist
        run: |
          set -eu
          for key in ladder wheel lot pinball race capsule slot bomb; do grep -q "${key}:" locales.js; done
          for key in dice yut coin order team; do grep -q "${key}:" locales.js; done
          grep -q "rerollAll:" locales.js
          grep -q "rerollExclude:" locales.js
          grep -q "showNow:" locales.js
          grep -q "pinballAria:" locales.js
          grep -q "bombWinner:" locales.js
      - name: Sitemap contains all 17 language URLs
        run: |
          set -eu
          grep -q '<loc>https://random-ppobgi.pages.dev/</loc>' sitemap.xml
          for lang in en ja es zh fr de pt id hi pl it nl tr vi th ar; do
            grep -q "<loc>https://random-ppobgi.pages.dev/$lang/</loc>" sitemap.xml
          done
      - name: SEO language alternates configured
        run: |
          set -eu
          grep -q 'hreflang' functions/_middleware.js
          grep -q 'x-default' functions/_middleware.js
          grep -q 'canonical' functions/_middleware.js
          grep -q 'meta\[name="description"\]' functions/_middleware.js

  browser-smoke:
    name: Browser Behavior QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/random-picker-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/en/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/random-picker-http.log
          exit 1
      - name: Run multilingual browser smoke
        run: node tests/i18n-browser-smoke.mjs

  quality-gate:
    name: Combined Quality Gate
    if: always()
    needs: [static-smoke, browser-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require both independent checks to pass
        env:
          STATIC_RESULT: ${{ needs.static-smoke.result }}
          BROWSER_RESULT: ${{ needs.browser-smoke.result }}
        run: |
          echo "static=$STATIC_RESULT"
          echo "browser=$BROWSER_RESULT"
          test "$STATIC_RESULT" = "success"
          test "$BROWSER_RESULT" = "success"