name: Production Browser Smoke

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
  schedule:
    - cron: '20 0 * * *'

permissions:
  contents: read
  checks: read

concurrency:
  group: random-picker-production-smoke
  cancel-in-progress: true

jobs:
  production-browser-smoke:
    name: Production Browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require repository security guardrails
        run: python3 security_guardrails.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for Cloudflare Pages deployment of this exact commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs"
          for i in {1..30}; do
            json=$(curl --fail --retry 3 --retry-delay 2 --max-time 20 -sS \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "$api" || printf '{"check_runs":[]}')
            cf=$(jq -c '[.check_runs[] | select(.name == "Cloudflare Pages" and .app.slug == "cloudflare-workers-and-pages")] | first // empty' <<<"$json")
            if [ -z "$cf" ]; then
              echo "Waiting for Cloudflare Pages check on ${GITHUB_SHA}"
              sleep 10
              continue
            fi
            status=$(jq -r '.status // ""' <<<"$cf")
            conclusion=$(jq -r '.conclusion // ""' <<<"$cf")
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" != "success" ]; then
                echo "Cloudflare Pages deployment failed for ${GITHUB_SHA}: conclusion=$conclusion"
                exit 1
              fi
              summary=$(jq -r '.output.summary // ""' <<<"$cf")
              preview=$(grep -oE 'https://[0-9a-f]+\.random-ppobgi\.pages\.dev' <<<"$summary" | head -n1 || true)
              echo "Cloudflare Pages exact commit deployed successfully: ${GITHUB_SHA}"
              if [ -n "$preview" ]; then echo "Deployment preview: $preview"; fi
              exit 0
            fi
            echo "Cloudflare Pages check status=$status for ${GITHUB_SHA}"
            sleep 10
          done
          echo "Timed out waiting for Cloudflare Pages deployment of ${GITHUB_SHA}"
          exit 1

      - name: Wait for public production alias
        run: |
          set -euo pipefail
          for i in {1..20}; do
            if curl -fsS --max-time 20 https://random-ppobgi.pages.dev/en/ >/dev/null; then
              echo "Production surface reachable"
              exit 0
            fi
            sleep 10
          done
          echo "Production surface did not become reachable"
          exit 1

      - name: Run multilingual behavior QA against production
        env:
          I18N_TEST_BASE: https://random-ppobgi.pages.dev
          EXPERIENCE_TEST_BASE: https://random-ppobgi.pages.dev
        run: |
          node tests/i18n-browser-smoke.mjs
          node tests/experience-browser-smoke.mjs