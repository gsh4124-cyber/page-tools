name: indexnow-submit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/indexnow-submit.yml'
      - 'index.html'
      - 'locales.js'
      - 'i18n-v2.js'
      - 'language-switch.js'
      - 'info-i18n.js'
      - 'functions/**'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'about/**'
      - 'guide/**'
      - 'privacy/**'
      - 'terms/**'
      - 'contact/**'
      - 'en/**'
      - 'ja/**'
      - 'es/**'
      - 'zh/**'
      - 'fr/**'
      - 'de/**'
      - 'pt/**'
      - 'id/**'
      - 'hi/**'
      - 'pl/**'
      - 'it/**'
      - 'nl/**'
      - 'tr/**'
      - 'vi/**'
      - 'th/**'
      - 'ar/**'
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Submit sitemap URLs to IndexNow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, urllib.error, xml.etree.ElementTree as ET
          key='5e2e0b34361f1bec6589eecf94582b9f'
          host='random-ppobgi.pages.dev'
          tree=ET.parse('sitemap.xml')
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls=[n.text.strip() for n in tree.findall('.//s:loc', ns) if n.text]
          payload=json.dumps({
              'host': host,
              'key': key,
              'keyLocation': f'https://{host}/{key}.txt',
              'urlList': urls,
          }).encode('utf-8')
          req=urllib.request.Request(
              'https://api.indexnow.org/IndexNow',
              data=payload,
              headers={'Content-Type':'application/json; charset=utf-8'},
              method='POST',
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print('IndexNow status:', r.status)
                  if r.status not in (200, 202):
                      raise SystemExit(f'unexpected IndexNow status {r.status}')
          except urllib.error.HTTPError as e:
              print(e.read().decode('utf-8', 'replace'))
              raise
          print(f'Submitted {len(urls)} URLs to IndexNow')
          PY
