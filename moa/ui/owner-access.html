<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>모아 · 소유자 입장</title><style>body{font:1rem/1.6 system-ui,sans-serif;background:#fbf8ef;color:#293e34;margin:0;padding:2rem 1rem}main{max-width:26rem;margin:3rem auto;padding:1.5rem;background:white;border:1px solid #dce4da;border-radius:1rem}h1{font-size:1.5rem}label{display:block;margin-top:1rem}input,button{box-sizing:border-box;font:inherit;width:100%;padding:.75rem;border:1px solid #bccbbd;border-radius:.5rem;margin:.3rem 0}button{background:#486b54;color:white;cursor:pointer}button:disabled{opacity:.5}summary{cursor:pointer;margin-top:1rem}p{overflow-wrap:anywhere}.hint{color:#526658}#gateNotice{min-height:2rem}</style><script type="module" src="/__moa_access.js"></script></head><body><main><h1>모아 · 소유자 입장</h1><p class="hint">이 사이트의 앱과 파일은 소유자만 열 수 있어요. 기존 모아 계정으로 확인해 주세요.</p><form id="gateEmailForm"><label for="gateEmail">이메일</label><input id="gateEmail" type="email" autocomplete="username" required><button type="submit">입장 메일 보내기</button></form><form id="gateVerifyForm"><label for="gateLink">받은 메일의 로그인 링크</label><input id="gateLink" type="url" autocomplete="off" required><button type="submit">링크 확인하고 입장</button></form><details><summary>비밀번호로 입장</summary><form id="gatePasswordForm"><label for="gatePasswordEmail">이메일</label><input id="gatePasswordEmail" type="email" autocomplete="username" required><label for="gatePassword">비밀번호</label><input id="gatePassword" type="password" autocomplete="current-password" required><button type="submit">소유자 확인</button></form></details><p id="gateNotice" role="status" aria-live="polite"></p></main></body></html>
