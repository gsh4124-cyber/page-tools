<dialog id="recoveryDialog" aria-labelledby="recoveryTitle">
<h2 id="recoveryTitle">비밀번호 찾기</h2><p class="muted">같은 로그인 계정을 쓰는 다른 서비스에도 새 비밀번호가 적용돼요. 변경 후 모든 기기에서 로그아웃합니다.</p>
<form id="requestRecoveryForm"><label for="recoveryEmail">계정 이메일</label><input id="recoveryEmail" type="email" autocomplete="username" required><button type="submit">복구 메일 받기</button></form>
<hr><form id="recoverPasswordForm"><label for="recoveryLink">메일의 비밀번호 복구 링크</label><input id="recoveryLink" type="url" autocomplete="off" required>
<label for="newPassword">새 비밀번호 (12자 이상)</label><input id="newPassword" type="password" autocomplete="new-password" minlength="12" required>
<label for="confirmPassword">새 비밀번호 다시 입력</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required><button type="submit">비밀번호 변경</button></form><button type="button" class="secondary" id="closeRecovery">닫기</button></dialog>
<dialog id="destructiveDialog" aria-labelledby="destructiveTitle"><form id="destructiveForm">
<h2 id="destructiveTitle">모아 탈퇴 · 기록 전체 삭제</h2><p id="destructiveHint"></p>
<label for="destructivePassword">현재 비밀번호 확인</label><input id="destructivePassword" type="password" autocomplete="current-password" required>
<p id="destructivePhraseHint"></p><label class="sr-only" for="destructivePhrase">확인 문구</label><input id="destructivePhrase" autocomplete="off" required>
<p id="destructiveProgress" role="status"></p><div class="row"><button type="submit" class="danger">확인하고 실행</button><button type="button" class="secondary" id="cancelDestructive">취소</button></div></form></dialog>
