name: ProofRail Pilot · Chromium QA

on:
  push:
    branches: [main]
    paths:
      - 'proofrail/**'
      - '.github/workflows/proofrail-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate source
        run: |
          test -s proofrail/index.html
          grep -q '<h1>ProofRail</h1>' proofrail/index.html
          grep -q 'GENERATION BLOCKED' proofrail/index.html
      - name: Start static server
        run: |
          python3 -m http.server 4173 >/tmp/proofrail-http.log 2>&1 &
          echo $! > /tmp/proofrail-http.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/proofrail/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/proofrail-http.log
          exit 1
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run ProofRail browser pilot
        run: |
          node - <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            await page.goto('http://127.0.0.1:4173/proofrail/',{waitUntil:'networkidle'});
            if((await page.locator('h1').textContent()).trim()!=='ProofRail') throw new Error('render failed');

            await page.click('#runNormal');
            if((await page.locator('#statusText').textContent()).trim()!=='PACKET READY') throw new Error('normal scenario did not produce packet');
            const normalContradictions=Number(await page.locator('#contradictionCount').textContent());
            if(normalContradictions!==0) throw new Error(`normal contradictions=${normalContradictions}`);
            const normalPacket=await page.locator('#packet').textContent();
            if(!normalPacket.includes('700,000원') || !normalPacket.includes('주문 → 입금 → 송장 → 배송완료')) throw new Error('normal packet evidence missing');
            await page.screenshot({path:'proofrail-normal.png',fullPage:true});

            await page.click('#runTampered');
            if((await page.locator('#statusText').textContent()).trim()!=='GENERATION BLOCKED') throw new Error('tampered scenario was not blocked');
            const contradictionCount=Number(await page.locator('#contradictionCount').textContent());
            if(contradictionCount<3) throw new Error(`expected >=3 contradictions, got ${contradictionCount}`);
            const checks=await page.locator('#checks').textContent();
            if(!checks.includes('금액 불일치')) throw new Error('amount mismatch not detected');
            if(!checks.includes('상대방 불일치')) throw new Error('party mismatch not detected');
            if(!checks.includes('시간순서 충돌')) throw new Error('temporal conflict not detected');
            const blocked=await page.locator('#packet').textContent();
            if(!blocked.includes('자동 패킷 생성 차단')) throw new Error('generation gate missing');
            await page.screenshot({path:'proofrail-tampered.png',fullPage:true});

            console.log(`ProofRail PILOT PASS: normal packet ready / tampered blocked with ${contradictionCount} contradictions`);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Upload pilot screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proofrail-pilot-screenshots
          path: |
            proofrail-normal.png
            proofrail-tampered.png
          if-no-files-found: ignore
