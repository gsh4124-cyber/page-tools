name: Calculator Release QA
on:
  push:
    branches: [qa/calculator-release-20261125]
permissions:
  contents: read
concurrency:
  group: calculator-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  calculator:
    name: Calculator (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    env:
      HOME: /root
      AUDIT_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: gsh4124-cyber/gsh4124-cyber.github.io
          ref: 15626bb28f42d6717128440437da09109c66a62a
          path: calculator-source
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Copy regression checks into isolated calculator checkout
        run: |
          mkdir -p calculator-source/qa
          cp qa/calculator-release/audit.mjs calculator-source/qa/audit.mjs
      - name: Install matching browser API
        working-directory: calculator-source
        run: npm install --no-save --package-lock=false playwright@1.64.1
      - name: Verify actual calculator source in desktop and mobile browsers
        working-directory: calculator-source
        run: node qa/audit.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: calculator-${{ matrix.engine }}
          path: calculator-source/qa/evidence/
          retention-days: 7
