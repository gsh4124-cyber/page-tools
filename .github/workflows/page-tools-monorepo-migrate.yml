name: Page Tools Monorepo Full Migration

on:
  push:
    branches:
      - migration/page-tools-monorepo
    paths:
      - '.github/workflows/page-tools-monorepo-migrate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.repository == 'gsh4124-cyber/random-ppobgi'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch with full history
        uses: actions/checkout@v4
        with:
          ref: migration/page-tools-monorepo
          fetch-depth: 0
          persist-credentials: true

      - name: Build deletion-safe monorepo snapshot and preserve source histories
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TARGET_BRANCH="migration/page-tools-monorepo"
          RANDOM_MAIN="d262c3bc4cebab2e36694f503d66d9204a1b943a"
          BIBLE_REPO="https://github.com/gsh4124-cyber/bible-reader.git"
          PC_REPO="https://github.com/gsh4124-cyber/pc-checkup.git"

          # Idempotency guard: never run twice after a successful migration.
          if [[ -f MIGRATION_COMPLETE_PAGE_TOOLS ]]; then
            echo "Migration already completed on this branch."
            exit 0
          fi

          # Preserve the complete current random-ppobgi main tree verbatim under its app directory.
          rm -rf random-ppobgi bible-reader pc-checkup
          mkdir -p random-ppobgi
          git archive "$RANDOM_MAIN" | tar -x -C random-ppobgi

          # Remove the old random-ppobgi app snapshot from monorepo root, while keeping
          # migration-only root files/workflows that did not exist on the original main.
          while IFS= read -r -d '' path; do
            if [[ "$path" != ".github" ]]; then
              git rm -r --ignore-unmatch -- "$path" || true
            fi
          done < <(git ls-tree -z --name-only "$RANDOM_MAIN")

          while IFS= read -r -d '' path; do
            git rm --ignore-unmatch -- "$path" || true
          done < <(git ls-tree -r -z --name-only "$RANDOM_MAIN" -- .github)

          git add random-ppobgi .github MIGRATION_PLAN.md
          git commit -m "Nest random-ppobgi intact under monorepo app directory"

          # Fetch complete source histories.
          git remote remove bible-reader 2>/dev/null || true
          git remote remove pc-checkup 2>/dev/null || true
          git remote add bible-reader "$BIBLE_REPO"
          git remote add pc-checkup "$PC_REPO"
          git fetch bible-reader '+refs/heads/*:refs/remotes/bible-reader/*'
          git fetch pc-checkup '+refs/heads/*:refs/remotes/pc-checkup/*'

          BIBLE_MAIN="$(git rev-parse refs/remotes/bible-reader/main)"
          PC_MAIN="$(git rev-parse refs/remotes/pc-checkup/main)"

          # True subtree merge without squashing: source commit histories remain ancestors.
          git merge -s ours --allow-unrelated-histories --no-commit "$BIBLE_MAIN"
          git read-tree --prefix=bible-reader/ -u "$BIBLE_MAIN"
          git commit -m "Import bible-reader complete main tree and history"

          git merge -s ours --allow-unrelated-histories --no-commit "$PC_MAIN"
          git read-tree --prefix=pc-checkup/ -u "$PC_MAIN"
          git commit -m "Import pc-checkup complete main tree and history"

          # Exact blob/path validation for all three app snapshots.
          compare_tree() {
            local source_ref="$1"
            local prefix="$2"
            local label="$3"
            git ls-tree -r --format='%(objectname)%x09%(path)' "$source_ref" | sort > "/tmp/${label}-source.txt"
            git ls-tree -r --format='%(objectname)%x09%(path)' HEAD "$prefix" \
              | sed -E "s#^([^[:space:]]+)[[:space:]]+${prefix}/#\\1\t#" \
              | sort > "/tmp/${label}-dest.txt"
            diff -u "/tmp/${label}-source.txt" "/tmp/${label}-dest.txt"
          }

          compare_tree "$RANDOM_MAIN" "random-ppobgi" "random"
          compare_tree "$BIBLE_MAIN" "bible-reader" "bible"
          compare_tree "$PC_MAIN" "pc-checkup" "pc"

          # Preserve every source branch in explicit namespaced legacy refs so the old
          # repositories can eventually be deleted without losing active/abandoned work.
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          while IFS= read -r ref; do
            branch="${ref#refs/remotes/origin/}"
            [[ "$branch" == "HEAD" || "$branch" == "$TARGET_BRANCH" ]] && continue
            git branch -f "legacy/random-ppobgi/$branch" "$ref"
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin/)

          while IFS= read -r ref; do
            branch="${ref#refs/remotes/bible-reader/}"
            [[ "$branch" == "HEAD" ]] && continue
            git branch -f "legacy/bible-reader/$branch" "$ref"
          done < <(git for-each-ref --format='%(refname)' refs/remotes/bible-reader/)

          while IFS= read -r ref; do
            branch="${ref#refs/remotes/pc-checkup/}"
            [[ "$branch" == "HEAD" ]] && continue
            git branch -f "legacy/pc-checkup/$branch" "$ref"
          done < <(git for-each-ref --format='%(refname)' refs/remotes/pc-checkup/)

          # Preserve all source tags under namespaced tag refs to avoid collisions.
          git fetch bible-reader '+refs/tags/*:refs/tags/legacy/bible-reader/*' || true
          git fetch pc-checkup '+refs/tags/*:refs/tags/legacy/pc-checkup/*' || true

          PC_SECURITY_REF="refs/remotes/pc-checkup/feature/security-network-check"
          PC_SECURITY_SHA="NOT_PRESENT"
          if git show-ref --verify --quiet "$PC_SECURITY_REF"; then
            PC_SECURITY_SHA="$(git rev-parse "$PC_SECURITY_REF")"
          fi

          cat > MIGRATION_MANIFEST.md <<EOF
          # Page Tools Monorepo Migration Manifest

          Target repository before rename: \`gsh4124-cyber/random-ppobgi\`
          Intended final repository name: \`gsh4124-cyber/page-tools\`
          Migration branch: \`$TARGET_BRANCH\`

          ## Imported source heads
          - random-ppobgi main: \`$RANDOM_MAIN\`
          - bible-reader main: \`$BIBLE_MAIN\`
          - pc-checkup main: \`$PC_MAIN\`
          - pc-checkup feature/security-network-check: \`$PC_SECURITY_SHA\`

          ## Integrity
          All three current main trees were compared by exact Git blob SHA + relative path after import.
          Source histories were merged without squash. Source branches are retained under \`legacy/<source>/...\`.
          Source tags are retained under \`legacy/<source>/...\` tag namespaces where present.

          ## Production protection
          This migration lives only on \`$TARGET_BRANCH\`. Existing Production deployments and default \`main\` are intentionally untouched until independent QA and explicit cutover approval.
          EOF

          touch MIGRATION_COMPLETE_PAGE_TOOLS
          git add MIGRATION_MANIFEST.md MIGRATION_COMPLETE_PAGE_TOOLS
          git commit -m "Record verified page-tools migration manifest"

          git push origin HEAD:"$TARGET_BRANCH"
          git push origin 'refs/heads/legacy/*:refs/heads/legacy/*'
          git push origin 'refs/tags/legacy/*:refs/tags/legacy/*' || true

      - name: Final branch summary
        shell: bash
        run: |
          set -euo pipefail
          echo "Migration branch head: $(git rev-parse HEAD)"
          git log --oneline --decorate -8
          test -d random-ppobgi
          test -d bible-reader
          test -d pc-checkup
          test -f MIGRATION_COMPLETE_PAGE_TOOLS
