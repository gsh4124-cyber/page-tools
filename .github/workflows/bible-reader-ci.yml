name: Bible Reader Monorepo QA

on:
  push:
    branches: ["main"]
    paths:
      - 'bible-reader/**'
      - 'tools/build_static.py'
      - 'tools/release_metadata.py'
      - 'tools/asset_cache.py'
      - '.github/workflows/bible-reader-ci.yml'
  pull_request:
    branches: ["main"]
    paths:
      - 'bible-reader/**'
      - 'tools/build_static.py'
      - 'tools/release_metadata.py'
      - 'tools/asset_cache.py'
      - '.github/workflows/bible-reader-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bible-reader-monorepo-qa-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: bible-reader

jobs:
  static-guardrails:
    name: Static Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate production artifact
        run: python3 ../tools/build_static.py bible-reader
      - name: Security guardrails
        run: python3 security_guardrails.py
      - name: JavaScript syntax
        run: |
          set -e
          for file in *.js; do node --check "$file"; done
          for file in tools/*.mjs; do [ -e "$file" ] || continue; node --check "$file"; done
      - name: Required runtime files
        run: |
          set -e
          for file in index.html styles.css features.css i18n-layout.css records-enhancements.css verse-multiselect.css reader-experience.css title-navigator.css app.js extra-translations.js local-file-language.js i18n.js runtime-ui-i18n.js ui-language-sync.js full-reader-loader.js reference.js book-finder.js compare.js verse-picker.js title-navigator.js clipboard.js title-nav.js exact-search.js verse-tools.js records-enhancements.js verse-multiselect.js reader-experience.js analytics.js robots.txt sitemap.xml 193977ee04feba4a99f471a555a2aa54.txt; do test -s "$file"; done
          test -s tools/reader-experience-smoke.mjs
          for lang in en fr de zh ru la pt ar; do test -s "$lang/index.html"; done
      - name: Preserve Cloudflare SEO origin contract
        run: |
          set -e
          PROD='https://bible-reader-1iz.pages.dev'
          grep -q "rel=\"canonical\" href=\"$PROD/\"" index.html
          grep -q '^Sitemap: https://bible-reader-1iz.pages.dev/sitemap.xml$' robots.txt
          grep -q '<loc>https://bible-reader-1iz.pages.dev/</loc>' sitemap.xml
          for lang in en fr de zh ru la pt ar; do
            grep -q "hreflang=\"$lang\"" "$lang/index.html"
            grep -q "rel=\"canonical\" href=\"$PROD/$lang/\"" "$lang/index.html"
            grep -q "<loc>$PROD/$lang/</loc>" sitemap.xml
            grep -q '<main id="entry-fallback"' "$lang/index.html"
            grep -q '<h1>' "$lang/index.html"
            grep -q '<p class="entry-summary"' "$lang/index.html"
            grep -q 'href="/?translation=' "$lang/index.html"
          done
          grep -q 'hreflang="x-default"' index.html

  behavior-qa:
    name: Behavior QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate multilingual integrity
        run: node tools/validate-i18n.mjs
      - name: Validate title navigation behavior
        run: node tools/validate-navigation.mjs
      - name: Validate progressive Bible search and cancellation
        run: node tools/validate-search-progress.mjs
      - name: Validate typing memory quiz grading and translations
        run: node tools/validate-memory-quiz.mjs

  mobile-browser-qa:
    name: Mobile layout (${{ matrix.engine }})
    # The official matching image includes all browser binaries, libraries and fonts.
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host
    defaults:
      run:
        shell: bash
        working-directory: bible-reader
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@v4
      - name: Trust checked-out workspace in container
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" ls-files > /dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build local artifact
        run: python3 ../tools/build_static.py bible-reader
      - name: Install matching Playwright package
        run: npm install --no-save --package-lock=false playwright@1.64.1
      - name: Test typing practice and recoverable collection deletion
        if: matrix.engine == 'chromium'
        run: node tools/memory-practice-smoke.mjs --local
      - name: Audit detailed practice accessibility and keyboard flows
        env:
          HOME: /root
          MEMORY_DETAIL_ENGINES: ${{ matrix.engine }}
        run: node tools/memory-detail-audit.mjs --local
      - name: Test draft resume and explicit discard protection
        env:
          HOME: /root
          MEMORY_DRAFT_ENGINES: ${{ matrix.engine }}
        run: node tools/memory-draft-smoke.mjs --local
      - name: Test both views across mobile layouts
        env:
          # GitHub mounts /github/home with a host owner; Firefox requires its own user's home.
          HOME: /root
          MEMORY_QUIZ_ENGINES: ${{ matrix.engine }}
        run: node tools/memory-quiz-mobile.mjs --local
      - name: Test reading, notes and verse selection
        if: matrix.engine == 'chromium'
        run: node tools/reader-detail-smoke.mjs --local
      - name: Test instant book grids and exam range choices
        if: matrix.engine == 'chromium'
        run: node tools/picker-navigation-smoke.mjs
      - name: Test collected passages and persistent exam dialog
        if: matrix.engine == 'chromium'
        run: node tools/memory-collection-smoke.mjs --local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-draft-${{ matrix.engine }}
          path: bible-reader/qa_evidence/live/memory-draft/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-detail-${{ matrix.engine }}
          path: bible-reader/qa_evidence/live/memory-detail/
      - uses: actions/upload-artifact@v4
        if: always() && matrix.engine == 'chromium'
        with:
          name: memory-practice
          path: bible-reader/qa_evidence/live/memory-practice/
      - uses: actions/upload-artifact@v4
        if: always() && matrix.engine == 'chromium'
        with:
          name: bible-picker-navigation
          path: bible-reader/qa_evidence/pickers/
      - uses: actions/upload-artifact@v4
        if: always() && matrix.engine == 'chromium'
        with:
          name: memory-collection
          path: bible-reader/qa_evidence/collection/
      - uses: actions/upload-artifact@v4
        if: always() && matrix.engine == 'chromium'
        with:
          name: reader-detail
          path: bible-reader/qa_evidence/reader-detail/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-mobile-${{ matrix.engine }}
          path: bible-reader/qa_evidence/mobile/

  quality-gate:
    name: Combined Quality Gate
    if: always()
    needs: [static-guardrails, behavior-qa, mobile-browser-qa]
    runs-on: ubuntu-latest
    steps:
      - name: Require static, behavior and mobile checks
        working-directory: .
        env:
          STATIC_RESULT: ${{ needs.static-guardrails.result }}
          BEHAVIOR_RESULT: ${{ needs.behavior-qa.result }}
          MOBILE_RESULT: ${{ needs.mobile-browser-qa.result }}
        run: |
          test "$STATIC_RESULT" = success
          test "$BEHAVIOR_RESULT" = success
          test "$MOBILE_RESULT" = success
