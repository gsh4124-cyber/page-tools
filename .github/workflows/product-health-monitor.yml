name: Vibe Coding Product Health Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '40 */6 * * *'
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/product-health-monitor.yml'
      - 'random-ppobgi/**'
      - 'bible-reader/**'
      - 'pc-checkup/**'

permissions:
  contents: read
  checks: read

concurrency:
  group: vibe-coding-product-health-browser-v2
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check live products
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          check_url() {
            local url="$1" result code seconds ok=false
            result=$(curl -L --retry 2 --max-time 20 -sS -o /dev/null -w '%{http_code}|%{time_total}' "$url" || printf '000|0')
            code="${result%%|*}"; seconds="${result##*|}"
            if [ "$code" -ge 200 ] 2>/dev/null && [ "$code" -lt 400 ] 2>/dev/null; then ok=true; fi
            jq -n --arg url "$url" --arg code "$code" --arg seconds "$seconds" --argjson ok "$ok" \
              '{url:$url,http_code:(try ($code|tonumber) catch 0),response_seconds:(try ($seconds|tonumber) catch 0),ok:$ok}'
          }

          # Validate meaningful, publicly served page content rather than HTTP 200 alone.
          # This is HTTP content QA, not browser interaction or deployment-SHA attestation.
          check_content() {
            local url="$1" expected="$2" file code ok=false
            file=$(mktemp)
            code=$(curl -L --retry 2 --max-time 20 -sS -o "$file" -w '%{http_code}' "$url" || echo 000)
            if [ "$code" = 200 ] && grep -Fq -- "$expected" "$file"; then ok=true; fi
            rm -f "$file"
            jq -n --arg url "$url" --arg code "$code" --argjson ok "$ok" \
              '{url:$url,http_code:(try ($code|tonumber) catch 0),contains_expected_content:$ok,ok:$ok}'
          }

          check_search() {
            local base="$1" rc sc count has=false ok=false
            rc=$(curl -L --retry 2 --max-time 20 -sS -o /tmp/robots -w '%{http_code}' "${base}robots.txt" || echo 000)
            sc=$(curl -L --retry 2 --max-time 20 -sS -o /tmp/sitemap -w '%{http_code}' "${base}sitemap.xml" || echo 000)
            count=$( (grep -o '<loc>' /tmp/sitemap || true) | wc -l | tr -d ' ')
            if grep -Eqi '^sitemap:[[:space:]]*https?://' /tmp/robots; then has=true; fi
            if [ "$rc" -ge 200 ] 2>/dev/null && [ "$rc" -lt 400 ] 2>/dev/null && [ "$sc" -ge 200 ] 2>/dev/null && [ "$sc" -lt 400 ] 2>/dev/null && [ "$count" -gt 0 ] && [ "$has" = true ]; then ok=true; fi
            jq -n --arg rc "$rc" --arg sc "$sc" --arg count "$count" --argjson has "$has" --argjson ok "$ok" \
              '{robots_http:($rc|tonumber),sitemap_http:($sc|tonumber),sitemap_url_count:($count|tonumber),robots_has_sitemap:$has,ok:$ok}'
          }

          check_ci() {
            local repo="$1" workflow="$2" runs run_sha status conclusion
            runs=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$repo/actions/workflows/$workflow/runs?branch=main&per_page=1")
            run_sha=$(jq -r '.workflow_runs[0].head_sha//""' <<<"$runs")
            status=$(jq -r '.workflow_runs[0].status//"missing"' <<<"$runs")
            conclusion=$(jq -r '.workflow_runs[0].conclusion//""' <<<"$runs")
            jq -n --arg repo "$repo" --arg workflow "$workflow" --arg run "$run_sha" --arg status "$status" --arg conclusion "$conclusion" \
              '{repo:$repo,workflow:$workflow,latest_run_sha:$run,status:$status,conclusion:$conclusion}'
          }

          PAGE_REPO='gsh4124-cyber/page-tools'
          RANDOM_PRODUCT=$(jq -n --argjson url "$(check_url 'https://random-ppobgi.pages.dev/')" --argjson search "$(check_search 'https://random-ppobgi.pages.dev/')" --argjson ci "$(check_ci "$PAGE_REPO" 'random-ppobgi-ci.yml')" '{url:$url,search_surface:$search,ci:$ci}')
          BIBLE_PRODUCT=$(jq -n --argjson url "$(check_url 'https://bible-reader-1iz.pages.dev/')" --argjson search "$(check_search 'https://bible-reader-1iz.pages.dev/')" --argjson ci "$(check_ci "$PAGE_REPO" 'bible-reader-ci.yml')" '{url:$url,search_surface:$search,ci:$ci}')
          DEVICE_PRODUCT=$(jq -n --argjson url "$(check_url 'https://pc-checkup.pages.dev/')" --argjson search "$(check_search 'https://pc-checkup.pages.dev/')" --argjson ci "$(check_ci "$PAGE_REPO" 'pc-checkup-ci.yml')" '{url:$url,search_surface:$search,ci:$ci}')

          # These cover the localized entry routes and device flow, independently of root health.
          RANDOM_LOCALE=$(check_content 'https://random-ppobgi.pages.dev/en/' 'Random Picker')
          BIBLE_LOCALE=$(check_content 'https://bible-reader-1iz.pages.dev/en/' 'Free Online Bible Reader')
          DEVICE_MOBILE=$(check_content 'https://pc-checkup.pages.dev/mobile.html' 'mobile.js')

          jq -n --arg generated_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" --argjson random "$RANDOM_PRODUCT" --argjson bible "$BIBLE_PRODUCT" --argjson device "$DEVICE_PRODUCT" \
            --argjson random_locale "$RANDOM_LOCALE" --argjson bible_locale "$BIBLE_LOCALE" --argjson device_mobile "$DEVICE_MOBILE" \
            '{generated_at:$generated_at,technical_repository:"gsh4124-cyber/page-tools",products:{"random-picker":($random + {localized_entry:$random_locale}),"bible-reader":($bible + {localized_entry:$bible_locale}),"device-checkup":($device + {mobile_entry:$device_mobile})}}' | tee /tmp/health.json

          {
            echo "## Vibe Coding Product Health"
            echo
            echo '\`\`\`json'
            cat /tmp/health.json
            echo '\`\`\`'
            echo
            echo "Operational state is stored in Supabase hwangje_ops; technical source is gsh4124-cyber/page-tools; this workflow does not write runtime snapshots to Vault."
          } >> "$GITHUB_STEP_SUMMARY"

          jq -e '[.products[] | (.url.ok and .search_surface.ok and ((.localized_entry // .mobile_entry).ok))] | all' /tmp/health.json >/dev/null

  production-browser:
    name: Production Browser QA (live deployed sites)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identify which deployed products changed
        id: changed
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo 'projects=bible-reader random-ppobgi pc-checkup' >> "$GITHUB_OUTPUT"
            echo 'deploy_projects=' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="$BEFORE_SHA"
          if [ -z "$before" ] || [[ "$before" =~ ^0+$ ]] || ! git cat-file -e "$before^{commit}"; then
            before="${GITHUB_SHA}^"
          fi
          files=$(git diff --name-only "$before" "$GITHUB_SHA")
          projects=()
          deploy_projects=()
          # A workflow-only change runs all three live tests; it does not force a site deployment.
          if grep -Fqx '.github/workflows/product-health-monitor.yml' <<< "$files"; then
            projects=(bible-reader random-ppobgi pc-checkup)
          fi
          for project in bible-reader random-ppobgi pc-checkup; do
            if grep -q "^$project/" <<< "$files"; then
              if [[ ! " ${projects[*]} " =~ " $project " ]]; then projects+=("$project"); fi
            fi
            # These files change QA behavior only; the deployed application is unchanged.
            case "$project" in
              bible-reader) qa_script='bible-reader/tools/production-smoke.mjs' ;;
              random-ppobgi) qa_script='random-ppobgi/tests/live-browser-proof.mjs' ;;
              pc-checkup) qa_script='pc-checkup/tools/device-experience-smoke.mjs' ;;
            esac
            if grep -q "^$project/" <<< "$files" && grep "^$project/" <<< "$files" | grep -Fvx "$qa_script" | grep -q .; then
              deploy_projects+=("$project")
            fi
          done
          echo "Live browser targets: ${projects[*]:-none}"
          echo "Require new Cloudflare deployment: ${deploy_projects[*]:-none}"
          echo "projects=${projects[*]}" >> "$GITHUB_OUTPUT"
          echo "deploy_projects=${deploy_projects[*]}" >> "$GITHUB_OUTPUT"
      - name: Verify Cloudflare deployment of changed application source matches commit
        if: steps.changed.outputs.deploy_projects != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECTS: ${{ steps.changed.outputs.deploy_projects }}
        shell: bash
        run: |
          set -euo pipefail
          read -ra products <<< "$PROJECTS"
          for attempt in $(seq 1 42); do
            checks=$(curl -fsSL --retry 2 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100")
            pending=()
            for project in "${products[@]}"; do
              result=$(jq -r --arg name "Cloudflare Pages: $project" '([.check_runs[] | select(.name == $name) | .conclusion] | first) // "missing"' <<< "$checks")
              if [ "$result" = failure ] || [ "$result" = cancelled ] || [ "$result" = timed_out ]; then
                echo "::error::Cloudflare deployment for $project failed ($result) at $GITHUB_SHA"
                exit 1
              fi
              if [ "$result" != success ]; then pending+=("$project=$result"); fi
            done
            if [ "${#pending[@]}" -eq 0 ]; then
              echo "Changed products deployed at $GITHUB_SHA: ${products[*]}"
              exit 0
            fi
            echo "Waiting for $GITHUB_SHA: ${pending[*]}"
            sleep 10
          done
          echo "::error::Cloudflare deployment identity not confirmed for $GITHUB_SHA"
          exit 1
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.projects != ''
        with:
          node-version: 22
      - name: Install supported Playwright Chromium
        if: steps.changed.outputs.projects != ''
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Random Picker desktop and mobile production interaction
        if: contains(steps.changed.outputs.projects, 'random-ppobgi')
        env:
          # A workflow/test-only push does not attest a new Cloudflare deployment.
          DEPLOY_VERIFIED_SHA: ${{ contains(steps.changed.outputs.deploy_projects, 'random-ppobgi') && github.sha || '' }}
        run: node random-ppobgi/tests/live-browser-proof.mjs
      - name: Bible Reader production navigation and multilingual interactions
        if: contains(steps.changed.outputs.projects, 'bible-reader')
        run: node bible-reader/tools/production-smoke.mjs
      - name: DEVICE CHECKUP production PC and mobile result interactions
        if: contains(steps.changed.outputs.projects, 'pc-checkup')
        run: node pc-checkup/tools/device-experience-smoke.mjs
      - name: Preserve production browser screenshots and results
        if: always() && steps.changed.outputs.projects != ''
        uses: actions/upload-artifact@v4
        with:
          name: page-tools-production-browser-${{ github.run_id }}
          path: |
            random-ppobgi/qa_evidence/live/
            bible-reader/qa_evidence/live/
            pc-checkup/qa_evidence/live/
          if-no-files-found: warn
          retention-days: 7
