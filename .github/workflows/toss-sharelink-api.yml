name: Toss Sharelink API - HOLD Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toss-sharelink-health:
    runs-on: [self-hosted, Windows]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Toss secrets
        shell: powershell
        env:
          TOSS_ACCESS_KEY: ${{ secrets.TOSS_ACCESS_KEY }}
          TOSS_SECRET_KEY: ${{ secrets.TOSS_SECRET_KEY }}
          TOSS_PUBLISHER_ID: ${{ secrets.TOSS_PUBLISHER_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TOSS_ACCESS_KEY)) { throw "Missing TOSS_ACCESS_KEY" }
          if ([string]::IsNullOrWhiteSpace($env:TOSS_SECRET_KEY)) { throw "Missing TOSS_SECRET_KEY" }
          if ([string]::IsNullOrWhiteSpace($env:TOSS_PUBLISHER_ID)) { throw "Missing TOSS_PUBLISHER_ID" }

      - name: Show runner public IPv4
        shell: powershell
        run: |
          $ip = (Invoke-RestMethod -Uri "https://api.ipify.org").Trim()
          Write-Host "Runner public IPv4: $ip"

      - name: Run health diagnostic only
        shell: powershell
        env:
          TOSS_ACCESS_KEY: ${{ secrets.TOSS_ACCESS_KEY }}
          TOSS_SECRET_KEY: ${{ secrets.TOSS_SECRET_KEY }}
          TOSS_PUBLISHER_ID: ${{ secrets.TOSS_PUBLISHER_ID }}
        run: |
          $requestFile = Join-Path $env:RUNNER_TEMP "toss-sharelink-health.json"
          @{ requestId = "manual-health-${{ github.run_id }}"; action = "health" } | ConvertTo-Json | Set-Content -Path $requestFile -Encoding UTF8
          powershell -NoProfile -ExecutionPolicy Bypass -File "tools/affiliate_apis/toss_sharelink.ps1" -RequestFile $requestFile
