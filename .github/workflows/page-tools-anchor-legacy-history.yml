name: Page Tools Anchor Legacy Histories

on:
  push:
    branches:
      - migration/page-tools-monorepo
    paths:
      - '.github/workflows/page-tools-anchor-legacy-history.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  anchor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch with full history
        uses: actions/checkout@v4
        with:
          ref: migration/page-tools-monorepo
          fetch-depth: 0
          persist-credentials: true

      - name: Anchor pc-checkup non-main histories without changing monorepo tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote remove pc-checkup 2>/dev/null || true
          git remote add pc-checkup https://github.com/gsh4124-cyber/pc-checkup.git
          git fetch pc-checkup '+refs/heads/*:refs/remotes/pc-checkup/*'

          : > LEGACY_HISTORY_ANCHORS.md
          {
            echo '# Legacy History Anchors'
            echo
            echo 'These source branch tips are anchored as merge parents of the migration branch so their commit histories remain reachable after legacy repository deletion.'
            echo
          } >> LEGACY_HISTORY_ANCHORS.md

          while IFS= read -r ref; do
            branch="${ref#refs/remotes/pc-checkup/}"
            [[ "$branch" == "HEAD" || "$branch" == "main" ]] && continue
            sha="$(git rev-parse "$ref")"
            echo "- pc-checkup/$branch: \`$sha\`" >> LEGACY_HISTORY_ANCHORS.md
            if ! git merge-base --is-ancestor "$sha" HEAD; then
              git merge -s ours --allow-unrelated-histories --no-ff -m "Anchor pc-checkup branch history: $branch" "$sha"
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/pc-checkup/)

          git add LEGACY_HISTORY_ANCHORS.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record anchored legacy branch histories'
          fi

          git push origin HEAD:migration/page-tools-monorepo

      - name: Verify anchor tips are ancestors
        shell: bash
        run: |
          set -euo pipefail
          git fetch pc-checkup '+refs/heads/*:refs/remotes/pc-checkup/*'
          for ref in refs/remotes/pc-checkup/feature/security-network-check refs/remotes/pc-checkup/global-batch1; do
            if git show-ref --verify --quiet "$ref"; then
              git merge-base --is-ancestor "$ref" HEAD
              echo "Anchored: $ref -> $(git rev-parse "$ref")"
            fi
          done
