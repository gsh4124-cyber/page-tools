name: Random Picker Analytics Probe

on:
  workflow_dispatch:
  schedule:
    - cron: '20 15 * * *' # 00:20 KST

permissions:
  contents: read

concurrency:
  group: random-picker-analytics-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Query Production D1 aggregate data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          # Missing GitHub secrets are an operator configuration failure, not zero traffic.
          # Keep the run red and identify only missing key names; never print secret values.
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured in this repository; D1 analytics were NOT queried."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured in this repository; D1 analytics were NOT queried."
            exit 1
          fi
          SQL=$(cat <<'SQL'
          SELECT event_date,event_name,method,input_mode,participant_bucket,result_mode,SUM(count) AS total
          FROM event_counts
          WHERE event_date >= date('now', '-13 days')
          GROUP BY event_date,event_name,method,input_mode,participant_bucket,result_mode
          ORDER BY event_date ASC,event_name ASC,method ASC;
          SQL
          )
          npx --yes wrangler@4 d1 execute random-ppobgi-analytics --remote --json --yes --command "$SQL" > /tmp/random-picker-d1.json
          {
            echo "## Random Picker analytics probe"
            echo
            echo "Source of truth: Cloudflare D1. Operational snapshots belong in Supabase hwangje_ops, not Vault."
            echo
            echo '\`\`\`json'
            cat /tmp/random-picker-d1.json
            echo '\`\`\`'
          } >> "$GITHUB_STEP_SUMMARY"
