name: Deploy Bible Reader to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bible-reader/**'
      - '.github/workflows/bible-reader-cloudflare-deploy.yml'

permissions:
  contents: read

concurrency:
  group: bible-reader-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL || secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Cloudflare deployment authorization
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'method=wrangler' >> "$GITHUB_OUTPUT"
            echo 'Authenticated direct deployment available'
          elif [ -n "$CLOUDFLARE_DEPLOY_HOOK" ]; then
            echo 'method=hook' >> "$GITHUB_OUTPUT"
            echo 'Authenticated deployment hook available'
          else
            echo '::error::Cloudflare deployment is not connected. Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions secrets (or account ID as variable), or CLOUDFLARE_DEPLOY_HOOK_URL.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        if: steps.auth.outputs.method == 'wrangler'
        with:
          node-version: 22
      - name: Deploy Bible Reader assets to existing Cloudflare Pages project
        if: steps.auth.outputs.method == 'wrangler'
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy bible-reader --project-name bible-reader-1iz --branch main --commit-hash "$GITHUB_SHA"
      - name: Trigger existing Cloudflare Pages Git deployment
        if: steps.auth.outputs.method == 'hook'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --request POST "$CLOUDFLARE_DEPLOY_HOOK" > /dev/null
          echo 'Cloudflare deployment hook triggered; awaiting public source confirmation'
      - name: Confirm exact live source before reporting success
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            matched=1
            for asset in index.html reader-experience.js reader-experience.css title-navigator.js verse-picker.js; do
              tmp=$(mktemp)
              if ! curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://bible-reader-1iz.pages.dev/$asset?revision=$GITHUB_SHA" -o "$tmp"; then
                matched=0
              elif ! cmp -s "bible-reader/$asset" "$tmp"; then
                matched=0
              fi
              rm -f "$tmp"
            done
            if [ "$matched" -eq 1 ]; then
              echo "PRODUCTION DEPLOYED AND VERIFIED: https://bible-reader-1iz.pages.dev/ revision $GITHUB_SHA"
              exit 0
            fi
            echo "Cloudflare not serving current revision yet (attempt $attempt/30)"
            sleep 8
          done
          echo '::error::Cloudflare deployment did not match the latest Bible Reader code on the public site.'
          exit 1
