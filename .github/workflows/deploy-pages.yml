name: Final QA and Cloudflare Production Check

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "bible-reader-production"
  cancel-in-progress: true

jobs:
  static-guardrails:
    name: Static Guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require repository security guardrails
        run: python3 security_guardrails.py

      - name: Check JavaScript syntax
        run: |
          set -e
          for file in *.js; do
            node --check "$file"
          done
          for file in tools/*.mjs; do
            [ -e "$file" ] || continue
            node --check "$file"
          done

      - name: Check required runtime files
        run: |
          set -e
          for file in index.html styles.css features.css ui-fix.css i18n-layout.css records-enhancements.css verse-multiselect.css title-navigator.css app.js extra-translations.js local-file-language.js i18n.js runtime-ui-i18n.js ui-language-sync.js full-reader-loader.js reference.js book-finder.js compare.js verse-picker.js title-navigator.js clipboard.js title-nav.js exact-search.js verse-tools.js records-enhancements.js verse-multiselect.js analytics.js robots.txt sitemap.xml 193977ee04feba4a99f471a555a2aa54.txt; do
            test -s "$file"
          done
          for lang in en fr de zh ru la pt ar; do
            test -s "$lang/index.html"
          done

      - name: Check Cloudflare production SEO entry points
        run: |
          set -e
          PROD='https://bible-reader-1iz.pages.dev'
          OLD='https://gsh4124-cyber.github.io/bible-reader'
          grep -q "rel=\"canonical\" href=\"$PROD/\"" index.html
          grep -q '^Sitemap: https://bible-reader-1iz.pages.dev/sitemap.xml$' robots.txt
          grep -q '<loc>https://bible-reader-1iz.pages.dev/</loc>' sitemap.xml
          for lang in en fr de zh ru la pt ar; do
            grep -q "hreflang=\"$lang\"" "$lang/index.html"
            grep -q "rel=\"canonical\" href=\"$PROD/$lang/\"" "$lang/index.html"
            grep -q "<loc>$PROD/$lang/</loc>" sitemap.xml
            grep -q 'src="/full-reader-loader.js"' "$lang/index.html"
            ! grep -q '/bible-reader/' "$lang/index.html"
          done
          ! grep -R -n --include='index.html' --include='sitemap.xml' --include='robots.txt' "$OLD" .
          grep -q 'hreflang="x-default"' index.html
          grep -q 'src="local-file-language.js"' index.html
          grep -q 'src="i18n.js"' index.html
          grep -q 'src="runtime-ui-i18n.js"' index.html
          grep -q 'src="ui-language-sync.js"' index.html
          grep -q 'src="title-navigator.js"' index.html
          grep -q 'href="title-navigator.css"' index.html
          grep -q 'src="verse-multiselect.js"' index.html
          grep -q 'href="verse-multiselect.css"' index.html
          test "$(tr -d '\r\n' < 193977ee04feba4a99f471a555a2aa54.txt)" = "193977ee04feba4a99f471a555a2aa54"

      - name: Check retired runtime is excluded
        run: |
          ! grep -q 'annotations-data.js' index.html
          ! grep -q 'annotations.js' index.html
          ! grep -q 'src="locale.js"' index.html
          ! grep -q 'src="locale-safe.js"' index.html
          ! grep -q 'src="language-selector.js"' index.html
          ! grep -q 'src="launch-translation.js"' index.html
          ! grep -q 'src="testament-select.js"' index.html
          ! grep -q 'src="daily.js"' index.html
          ! grep -q 'src="focus-mode.js"' index.html
          ! grep -q 'src="book-picker.js"' index.html
          ! grep -q 'src="number-jump.js"' index.html

  behavior-qa:
    name: Behavior QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate multilingual integrity
        run: node tools/validate-i18n.mjs
      - name: Validate current title navigation behavior
        run: node tools/validate-navigation.mjs

  quality-gate:
    name: Combined Quality Gate
    if: always()
    needs: [static-guardrails, behavior-qa]
    runs-on: ubuntu-latest
    steps:
      - name: Require both independent checks to pass
        env:
          STATIC_RESULT: ${{ needs.static-guardrails.result }}
          BEHAVIOR_RESULT: ${{ needs.behavior-qa.result }}
        run: |
          test "$STATIC_RESULT" = "success"
          test "$BEHAVIOR_RESULT" = "success"

  production-smoke:
    name: Cloudflare Production Browser QA
    runs-on: ubuntu-latest
    needs: quality-gate
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for Cloudflare production surface
        run: |
          set -e
          for i in {1..30}; do
            sitemap=$(curl -fsS --max-time 20 https://bible-reader-1iz.pages.dev/sitemap.xml || true)
            robots=$(curl -fsS --max-time 20 https://bible-reader-1iz.pages.dev/robots.txt || true)
            multiselect=$(curl -fsS --max-time 20 https://bible-reader-1iz.pages.dev/verse-multiselect.js || true)
            if printf '%s' "$sitemap" | grep -q 'https://bible-reader-1iz.pages.dev/en/' \
              && ! printf '%s' "$sitemap" | grep -q 'gsh4124-cyber.github.io/bible-reader' \
              && printf '%s' "$robots" | grep -q 'https://bible-reader-1iz.pages.dev/sitemap.xml' \
              && printf '%s' "$multiselect" | grep -q 'verse-multi-actionbar'; then
              echo "Cloudflare production SEO and multi-select surface updated"
              exit 0
            fi
            sleep 10
          done
          echo "Cloudflare production did not expose the updated runtime in time"
          exit 1
      - name: Run production behavior QA
        run: node tools/production-smoke.mjs

  notify-indexnow:
    name: Notify IndexNow
    runs-on: ubuntu-latest
    needs: quality-gate
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Notify IndexNow of Cloudflare production URLs
        run: |
          python3 - <<'PY'
          import json, urllib.request
          key = "193977ee04feba4a99f471a555a2aa54"
          base = "https://bible-reader-1iz.pages.dev/"
          urls = [base] + [base + lang + "/" for lang in ["en","fr","de","zh","ru","la","pt","ar"]]
          payload = {
              "host": "bible-reader-1iz.pages.dev",
              "key": key,
              "keyLocation": base + key + ".txt",
              "urlList": urls,
          }
          request = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print(f"IndexNow response: {response.getcode()}; submitted {len(urls)} URLs")
          PY