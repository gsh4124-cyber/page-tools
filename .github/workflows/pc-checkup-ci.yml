name: DEVICE CHECKUP Monorepo QA

on:
  push:
    branches: ["main"]
    paths:
      - 'pc-checkup/**'
      - 'tools/build_static.py'
      - 'tools/release_metadata.py'
      - '.github/workflows/pc-checkup-ci.yml'
  pull_request:
    branches: ["main"]
    paths:
      - 'pc-checkup/**'
      - 'tools/build_static.py'
      - 'tools/release_metadata.py'
      - '.github/workflows/pc-checkup-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pc-checkup-monorepo-qa
  cancel-in-progress: true

defaults:
  run:
    working-directory: pc-checkup

jobs:
  source-guardrails:
    name: Source Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Security guardrails
        run: python3 security_guardrails.py
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check mobile.js
          node --check device-experience.js
      - name: Summary locale and telemetry regression
        run: node tools/validate-experience.mjs
      - name: Python tool syntax
        run: |
          python -m py_compile tools/expand_batch2.py tools/append_cn_ru.py tools/normalize_generated_structure.py tools/normalize_generated_keyboard.py tools/normalize_display_colors.py tools/normalize_navigation_order.py tools/inject_language_ux.py tools/localize_korean_ui.py tools/finalize_keyboard_help.py tools/validate_dist.py
      - name: Required source files
        run: |
          set -e
          for file in index.html checkup.html display.html keyboard.html mic.html mobile.html mouse.html speaker.html webcam.html app.js mobile.js device-experience.js styles.css robots.txt sitemap.xml tools/build_global.py.gz tools/expand_batch2.py tools/append_cn_ru.py tools/normalize_generated_structure.py tools/normalize_generated_keyboard.py tools/normalize_display_colors.py tools/normalize_navigation_order.py tools/inject_language_ux.py tools/localize_korean_ui.py tools/finalize_keyboard_help.py tools/validate_dist.py finalcheck/index.html refundproof/index.html refundproof/wanted-demo.html; do
            test -s "$file"
          done

  build-qa:
    name: Build + Artifact QA (No Deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate exact production artifact
        run: python3 tools/build_site.py

  quality-gate:
    name: Combined Quality Gate
    if: always()
    needs: [source-guardrails, build-qa]
    runs-on: ubuntu-latest
    steps:
      - name: Require both checks
        working-directory: .
        env:
          SOURCE_RESULT: ${{ needs.source-guardrails.result }}
          BUILD_RESULT: ${{ needs.build-qa.result }}
        run: |
          test "$SOURCE_RESULT" = success
          test "$BUILD_RESULT" = success
