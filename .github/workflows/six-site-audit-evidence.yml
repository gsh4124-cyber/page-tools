name: Six site audit evidence
on:
  push:
    branches: [audit/six-sites-20261124]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: qa/six-site-audit/calc
    env:
      HOME: /root
      AUDIT_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.64.1
      - run: node qa/audit.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: six-sites-${{ matrix.engine }}
          path: qa/six-site-audit/calc/qa/evidence/
          retention-days: 7
